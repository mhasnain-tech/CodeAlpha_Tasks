<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>CALCULATOR</title>

<style>
 *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

@font-face {

    src: url(./Montserrat/Montserrat-VariableFont_wght.ttf);
}
body{

.calculator{

    padding: 25px;
    box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;

input {

input::placeholder{

button{

}
.equalbtn{
    background-color: rgb(255, 166, 0);
    font-family: Montserrat;
}
.operator{
    color: greenyellow;
    font-family: Montserrat;

<body>
    <div class="main">

    </div>

// 2. YOUR KEYBOARD LOGIC (Written exactly like your click logic)
window.addEventListener("keydown", (e) => {
    let key = e.key;

    // Filter to only react to actual calculator keys
    const isNumberOrOperator = /[0-9.+\-*/]/.test(key);
    const isSpecialKey = ["Enter", "Backspace", "Escape"].includes(key);

    if (isNumberOrOperator || isSpecialKey) {
        e.preventDefault(); // Prevents default browser typing to protect your 'result' variable

        // --- Written exactly like your conditional logic above ---
        if (key == "Enter") {
            result = eval(result);
            input.value = result;
            if (input.value == "undefined") {
                result = "Please Enter a Value";
                input.value = result;
            }
        }
        else if (key == "Escape") {
            result = "";
            input.value = result;
        }
        else if (key == "Backspace") {
            result = result.substring(0,result.length - 1)
            input.value = result;
        }
        else {
            result += key;
            input.value = result;
        }
    }
});

    </script>
